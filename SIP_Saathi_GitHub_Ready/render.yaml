services:
  - type: web
    name: sip-saathi-pilot
    runtime: python
    buildCommand: pip install -r mvp/requirements.txt
    startCommand: uvicorn mvp.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
